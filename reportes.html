<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reportes | Gestion Restaurante</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .report-layout {
      display: grid;
      gap: 16px;
    }

    .report-chart {
      min-height: 320px;
      border-radius: 18px;
      background: rgba(17,24,39,.03);
      border: 1px dashed rgba(180,83,9,.35);
      padding: 16px;
    }

    .report-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .report-tab {
      border: 1px solid rgba(17,24,39,.10);
      border-radius: 12px;
      background: #f3f4f6;
      color: #111827;
      cursor: pointer;
      font-weight: 800;
      padding: 10px 16px;
    }

    .report-tab.active {
      background: linear-gradient(90deg, #f59e0b, #f97316);
      border-color: transparent;
      color: #fff;
    }

    .bar-list {
      display: grid;
      gap: 14px;
    }

    .bar-row {
      display: grid;
      gap: 8px;
    }

    .bar-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #111827;
      font-weight: 800;
    }

    .bar-total {
      color: #92400e;
      white-space: nowrap;
    }

    .bar-track {
      height: 38px;
      overflow: hidden;
      border-radius: 12px;
      background: #fff7ed;
      border: 1px solid rgba(245,158,11,.18);
    }

    .bar-fill {
      min-width: 42px;
      height: 100%;
      border-radius: 12px;
      background: linear-gradient(90deg, #f59e0b, #f97316);
      box-shadow: 0 8px 18px rgba(249,115,22,.22);
    }

    .report-message {
      margin: 0;
      padding: 18px;
      border-radius: 14px;
      background: #fff7ed;
      border: 1px solid rgba(245,158,11,.20);
      color: #92400e;
      font-weight: 800;
    }

    .platos-list {
      display: grid;
      gap: 12px;
    }

    .plato-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(17,24,39,.03);
      border: 1px solid rgba(17,24,39,.08);
    }

    .plato-rank {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(90deg, #f59e0b, #f97316);
      color: #fff;
      font-weight: 900;
    }

    .plato-name {
      color: #111827;
      font-weight: 900;
    }

    .plato-meta {
      color: #6b7280;
      font-size: 14px;
      margin-top: 4px;
    }

    .plato-total {
      color: #92400e;
      font-weight: 900;
      white-space: nowrap;
    }

    @media (max-width: 520px) {
      .dash-actions {
        width: 100%;
      }

      .dash-actions .dash-btn {
        justify-content: center;
        width: 100%;
      }

      .report-tab {
        flex: 1 1 auto;
      }

      .bar-info {
        align-items: flex-start;
        flex-direction: column;
      }

      .plato-item {
        grid-template-columns: auto 1fr;
      }

      .plato-total {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
  <div class="dash">
    <header class="dash-top">
      <div class="dash-title">
        <h1>Reportes del Restaurante</h1>
        <p>Ventas por dia, semana y mes</p>
      </div>

      <div class="dash-actions">
        <a class="dash-btn" href="dashboard.html" style="text-decoration:none;">
          <i class="bi bi-arrow-left"></i>
          Volver
        </a>
      </div>
    </header>

    <section class="report-layout">
      <article class="panel">
        <div class="panel-head">
          <h2>Ventas por dia, semana y mes</h2>
          <span class="pill"><i class="bi bi-bar-chart"></i> Reportes</span>
        </div>

        <div class="report-tabs">
          <button class="report-tab active" type="button" data-periodo="dia" onclick="cambiarPeriodo('dia')">D&iacute;a</button>
          <button class="report-tab" type="button" data-periodo="semana" onclick="cambiarPeriodo('semana')">Semana</button>
          <button class="report-tab" type="button" data-periodo="mes" onclick="cambiarPeriodo('mes')">Mes</button>
        </div>

        <div id="grafica-ventas" class="report-chart"></div>
      </article>

      <article class="panel">
        <div class="panel-head">
          <h2>Platos m&aacute;s vendidos del men&uacute;</h2>
          <span class="pill"><i class="bi bi-trophy"></i> Ranking</span>
        </div>

        <div id="platos-mas-vendidos" class="platos-list">
          <p class="report-message">Cargando platos m&aacute;s vendidos...</p>
        </div>
      </article>
    </section>
  </div>

  <script>
    let ventasReportes = {
      dia: [],
      semana: [],
      mes: []
    };

    document.addEventListener('DOMContentLoaded', cargarReportes);
    document.addEventListener('DOMContentLoaded', cargarPlatosMasVendidos);

    async function cargarReportes() {
      const grafica = document.getElementById('grafica-ventas');
      grafica.innerHTML = '<p class="report-message">Cargando reportes...</p>';

      try {
        const respuesta = await fetch('/api/reportes/ventas');
        ventasReportes = await respuesta.json();
        mostrarReporte('dia');
      } catch (error) {
        console.error('Error cargando reportes:', error);
        grafica.innerHTML = '<p class="report-message">No se pudieron cargar los reportes.</p>';
      }
    }

    function cambiarPeriodo(periodo) {
      mostrarReporte(periodo);
    }

    function mostrarReporte(periodo) {
      const botones = document.querySelectorAll('.report-tab');
      botones.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.periodo === periodo);
      });

      const datos = ventasReportes[periodo] || [];
      dibujarGrafica(datos, periodo);
    }

    function dibujarGrafica(datos, periodo) {
      const grafica = document.getElementById('grafica-ventas');

      if (datos.length === 0) {
        grafica.innerHTML = '<p class="report-message">No hay ventas registradas para este per&iacute;odo.</p>';
        return;
      }

      const totalMayor = Math.max(...datos.map(item => Number(item.total)));
      const barras = datos.map(item => {
        const total = Number(item.total);
        const ancho = totalMayor > 0 ? (total / totalMayor) * 100 : 0;

        return `
          <div class="bar-row">
            <div class="bar-info">
              <span>${formatearPeriodo(item.periodo, periodo)}</span>
              <span class="bar-total">${formatearDinero(total)}</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${ancho}%"></div>
            </div>
          </div>
        `;
      }).join('');

      grafica.innerHTML = '<div class="bar-list">' + barras + '</div>';
    }

    function formatearPeriodo(periodo, tipo) {
      if (!periodo) return 'Sin periodo';
      const texto = String(periodo);

      if (tipo === 'dia' && texto.includes('T')) {
        return texto.split('T')[0];
      }

      if (tipo === 'semana' && texto.includes('-W')) {
        const partes = texto.split('-W');
        return 'Semana ' + Number(partes[1]) + ' - ' + partes[0];
      }

      return texto;
    }

    function formatearDinero(valor) {
      return '$' + Number(valor).toFixed(2);
    }

    async function cargarPlatosMasVendidos() {
      const contenedor = document.getElementById('platos-mas-vendidos');

      try {
        const respuesta = await fetch('/api/reportes/platos-mas-vendidos');
        const platos = await respuesta.json();

        if (platos.length === 0) {
          contenedor.innerHTML = '<p class="report-message">No hay platos vendidos registrados.</p>';
          return;
        }

        contenedor.innerHTML = platos.map((plato, index) => `
          <div class="plato-item">
            <div class="plato-rank">#${index + 1}</div>
            <div>
              <div class="plato-name">${plato.nombre_producto}</div>
              <div class="plato-meta">${plato.cantidad_vendida} vendidos</div>
            </div>
            <div class="plato-total">${formatearDinero(plato.total_generado)}</div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error cargando platos mas vendidos:', error);
        contenedor.innerHTML = '<p class="report-message">No se pudieron cargar los platos m&aacute;s vendidos.</p>';
      }
    }
  </script>
</body>
</html>
